<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>しがバス — KODOCO</title>
<meta name="description" content="滋賀県内のバスをリアルタイム表示。近くのバス停・時刻表・路線図を確認できます。">
<meta property="og:type" content="website">
<meta property="og:title" content="しがバス — 滋賀のバスをリアルタイム表示">
<meta property="og:description" content="現在地から近くのバス停を探して、時刻表・路線図を確認。草津・栗東・野洲・甲賀・高島・東近江など48路線対応。">
<meta property="og:url" content="https://kodoco.jp/traffic/">
<meta property="og:image" content="https://kodoco.jp/traffic/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="しがバス — 滋賀のバスをリアルタイム表示">
<meta name="twitter:description" content="現在地から近くのバス停を探して、時刻表・路線図を確認。">
<meta name="twitter:image" content="https://kodoco.jp/traffic/ogp.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #FAF8F4;
  --bg-warm:     #F3EEE4;
  --card:        #FFFFFF;
  --ink:         #2C2A26;
  --ink-soft:    #6E6A62;
  --ink-faint:   #A8A39A;
  --line:        #E8E3D9;
  --line-soft:   #F0ECE3;
  --green:       #7A9B7E;
  --green-deep:  #5B7F61;
  --green-soft:  #E7EEE3;
  --peach:       #E8B69A;
  --peach-deep:  #B67A5A;
  --radius:      16px;
  --radius-sm:   10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter','Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

/* ━━ HEADER ━━ */
.header{
  height:54px;
  background:rgba(250,248,244,0.94);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;
  padding:0 16px;gap:12px;
  flex-shrink:0;z-index:400;
}
.logo-area{display:flex;align-items:center;gap:10px;}
.logo-bus{width:44px;height:32px;flex-shrink:0;}
.logo-text{display:flex;flex-direction:column;gap:0;}
.logo-brand{font-size:9px;font-weight:700;color:var(--green-deep);letter-spacing:.08em;text-transform:uppercase;}
.logo-name{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.03em;line-height:1.1;}
.header-search{flex:1;max-width:260px;margin-left:4px;display:flex;align-items:center;background:var(--bg-warm);border:1px solid var(--line);border-radius:999px;padding:0 12px;gap:6px;height:34px;}
.header-search input{background:none;border:none;outline:none;color:var(--ink);font-size:12px;flex:1;font-family:inherit;}
.header-search input::placeholder{color:var(--ink-faint);}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--green-deep);background:var(--green-soft);border-radius:999px;padding:4px 10px;flex-shrink:0;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green-deep);animation:blink 1.4s ease infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ━━ LAYOUT ━━ */
.layout{flex:1;display:flex;overflow:hidden;position:relative;}

/* ━━ SIDEBAR ━━ */
.sidebar{width:300px;flex-shrink:0;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-inner{overflow-y:auto;flex:1;}
.sidebar-inner::-webkit-scrollbar{width:3px;}
.sidebar-inner::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
.sidebar-sec{padding:16px;}
.sidebar-sec+.sidebar-sec{border-top:1px solid var(--line-soft);}
.sec-label{font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.locate-btn-s{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--green-soft);color:var(--green-deep);font-size:13px;font-weight:700;border:1.5px solid var(--green);border-radius:999px;padding:11px 20px;cursor:pointer;transition:background .15s;font-family:inherit;}
.locate-btn-s:hover{background:#daebd6;}
.locate-btn-s.loading{opacity:.6;pointer-events:none;}
.near-card{background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--line);padding:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.near-card:hover{border-color:var(--green);box-shadow:0 2px 8px rgba(91,127,97,.1);}
.near-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;margin-bottom:6px;}
.near-stop-name{font-size:13px;font-weight:700;}
.near-dist{font-size:10px;font-weight:600;color:var(--green-deep);background:var(--green-soft);border-radius:999px;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
.near-route-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;}
.near-route-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.near-route-name{font-size:10px;color:var(--ink-soft);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.near-times{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px;}
.near-time{font-size:10px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink-soft);}
.near-time.next{border-color:var(--peach);color:var(--peach-deep);background:#fef6f0;}
.near-empty{font-size:12px;color:var(--ink-faint);text-align:center;padding:16px 0;line-height:1.8;}
.route-card{background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--line);margin-bottom:6px;cursor:pointer;overflow:hidden;transition:border-color .15s;}
.route-card:hover,.route-card.active{border-color:var(--green);}
.route-card-head{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.route-stripe{width:4px;height:32px;border-radius:2px;flex-shrink:0;}
.route-info{flex:1;min-width:0;}
.route-name{font-size:12px;font-weight:700;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.route-op{font-size:10px;color:var(--ink-faint);}
.route-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--green-soft);color:var(--green-deep);flex-shrink:0;}
.route-detail{display:none;padding:0 12px 12px 26px;border-top:1px solid var(--line-soft);}
.route-card.active .route-detail{display:block;}
.detail-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 0 10px;}
.dmeta{background:var(--bg);border-radius:var(--radius-sm);padding:6px 8px;}
.dmeta-label{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px;}
.dmeta-val{font-size:11px;font-weight:600;}
.stop-list{display:flex;flex-direction:column;}
.stop-item{display:flex;align-items:center;gap:8px;padding:4px 0;position:relative;}
.stop-item::before{content:'';position:absolute;left:4px;top:15px;width:1px;height:100%;background:var(--line);}
.stop-item:last-child::before{display:none;}
.stop-dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor;background:var(--card);flex-shrink:0;z-index:1;}
.stop-nm{font-size:11px;flex:1;}
.stop-next{font-size:10px;color:var(--ink-faint);white-space:nowrap;}
.stop-next.soon{color:var(--peach-deep);font-weight:700;}
.stops-more{font-size:10px;color:var(--ink-faint);margin-top:4px;padding-left:18px;cursor:pointer;}
.stops-more:hover{color:var(--green-deep);}

/* ━━ MAP ━━ */
.map-wrap{flex:1;position:relative;overflow:hidden;}
#map{width:100%;height:100%;}
.leaflet-container{background:#ede8df;}
.locate-fab{display:none;position:absolute;right:14px;bottom:248px;z-index:300;width:48px;height:48px;background:var(--green);border:none;border-radius:50%;box-shadow:0 4px 14px rgba(91,127,97,.38);cursor:pointer;align-items:center;justify-content:center;font-size:20px;transition:box-shadow .15s,transform .15s;font-family:inherit;color:#fff;}
.locate-fab:active{transform:scale(.92);}
.map-hint{display:none;position:absolute;bottom:252px;left:50%;transform:translateX(-50%);z-index:299;background:rgba(44,42,38,.75);color:#fff;font-size:11px;font-weight:600;padding:6px 14px;border-radius:20px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(4px);letter-spacing:.02em;}
.locate-fab:hover{box-shadow:0 4px 16px rgba(44,42,38,.18);}
.locate-fab.loading{opacity:.5;pointer-events:none;}
.pulse-wrap{position:relative;width:24px;height:24px;}
.pulse-dot{width:14px;height:14px;background:var(--green-deep);border:2.5px solid #fff;border-radius:50%;position:absolute;top:5px;left:5px;box-shadow:0 2px 6px rgba(91,127,97,.4);}
.pulse-ring{width:28px;height:28px;border:2px solid var(--green-deep);border-radius:50%;position:absolute;top:-2px;left:-2px;animation:pulseRing 1.6s ease-out infinite;}
@keyframes pulseRing{0%{transform:scale(.5);opacity:.8}100%{transform:scale(1.8);opacity:0}}
.leaflet-popup-content-wrapper{background:var(--card) !important;border:1px solid var(--line) !important;border-radius:var(--radius) !important;box-shadow:0 8px 24px rgba(44,42,38,.12) !important;color:var(--ink) !important;}
.leaflet-popup-tip{background:var(--card) !important;}
.pop-name{font-size:13px;font-weight:700;margin-bottom:6px;}
.pop-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px;}
.pop-tag{font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;}
.pop-deps{font-size:11px;}
.pop-dep-row{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;}
.pop-dep-dot{width:8px;height:8px;border-radius:50%;margin-top:2px;flex-shrink:0;}
.pop-dep-label{font-size:9px;color:var(--ink-faint);margin-bottom:3px;}
.pop-dep-times{display:flex;gap:4px;flex-wrap:wrap;}
.pop-time{font-size:10px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;}
.pop-time.next{border-color:var(--peach);color:var(--peach-deep);}
.bus-mk{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;border:2.5px solid rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer;transition:transform .15s;}
.bus-mk:hover{transform:scale(1.25);}
.bus-mk.bp-active{transform:scale(1.3);box-shadow:0 0 0 4px rgba(255,255,255,.5),0 4px 16px rgba(0,0,0,.28);}
@keyframes busFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* ── Route strip ── */
.rt-strip-wrap{overflow-x:auto;padding:10px 16px 14px;flex-shrink:0;-webkit-overflow-scrolling:touch;background:var(--bg-warm);border-bottom:1px solid var(--line-soft);}
.rt-strip-wrap::-webkit-scrollbar{display:none;}
.rt-strip{display:flex;align-items:flex-end;gap:0;position:relative;min-width:max-content;padding-top:28px;}
.rt-stop{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
.rt-connector{width:28px;height:3px;flex-shrink:0;margin-top:5px;}
.rt-dot-wrap{display:flex;align-items:center;}
.rt-dot{width:10px;height:10px;border-radius:50%;border:2px solid rgba(255,255,255,.8);flex-shrink:0;}
.rt-dot.rt-terminal{width:14px;height:14px;border-radius:3px;}
.rt-dot.rt-current{width:12px;height:12px;}
.rt-bus-icon{font-size:17px;position:absolute;top:-24px;left:50%;transform:translateX(-50%);filter:drop-shadow(0 1px 3px rgba(0,0,0,.3));animation:busFloat .9s ease-in-out infinite;}
.rt-label{font-size:9px;font-weight:600;color:var(--ink-faint);max-width:54px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;margin-top:2px;}
.rt-label.rt-lbl-current{color:var(--ink);font-weight:800;}
.rt-label.rt-lbl-passed{opacity:.35;}
.rt-time-lbl{font-size:8px;color:var(--ink-faint);line-height:1;}
.rt-time-lbl.rt-soon{color:var(--peach-deep);font-weight:700;}

/* ━━ BUS INFO PANEL ━━ */
.bus-panel{position:absolute;top:0;right:0;bottom:0;width:340px;z-index:350;background:var(--card);border-left:1px solid var(--line);box-shadow:-4px 0 24px rgba(44,42,38,.08);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;}
.bus-panel.open{transform:translateX(0);}
.bp-head{padding:16px;border-bottom:1px solid var(--line-soft);flex-shrink:0;position:relative;}
.bp-close{position:absolute;top:14px;right:14px;width:28px;height:28px;background:var(--bg-warm);border:none;border-radius:50%;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;font-family:inherit;color:var(--ink-soft);}
.bp-close:hover{background:var(--line);}
.bp-route-row{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.bp-stripe{width:14px;height:14px;border-radius:50%;}
.bp-route-name{font-size:15px;font-weight:700;}
.bp-operator{font-size:11px;color:var(--ink-faint);margin-bottom:8px;}
.bp-next{font-size:12px;color:var(--ink-soft);background:var(--green-soft);border-radius:var(--radius-sm);padding:8px 10px;line-height:1.6;}
.bp-next-stop{font-weight:700;color:var(--green-deep);}
.bp-next-min{font-weight:700;color:var(--peach-deep);}
.bp-scroll{overflow-y:auto;flex:1;}
.bp-scroll::-webkit-scrollbar{width:3px;}
.bp-scroll::-webkit-scrollbar-thumb{background:var(--line);}
.trip-selector{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;flex-shrink:0;}
.trip-selector::-webkit-scrollbar{display:none;}
.trip-pill{font-size:10px;font-weight:700;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink-soft);cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:background .15s;}
.trip-pill.active{background:var(--green-soft);border-color:var(--green);color:var(--green-deep);}
.trip-label{font-size:10px;font-weight:700;color:var(--ink-faint);letter-spacing:.1em;text-transform:uppercase;padding:12px 16px 6px;}
.tl-list{display:flex;flex-direction:column;padding:0 16px 32px;}
.tl-stop{display:flex;align-items:flex-start;gap:10px;padding:5px 0;position:relative;}
.tl-stop::before{content:'';position:absolute;left:6px;top:18px;width:1px;height:100%;background:var(--line);}
.tl-stop:last-child::before{display:none;}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--bg);flex-shrink:0;z-index:1;margin-top:2px;}
.tl-dot.passed{background:var(--line);border-color:var(--line);}
.tl-dot.current{box-shadow:0 0 0 3px var(--green-soft);}
.tl-body{flex:1;display:flex;align-items:center;gap:6px;min-width:0;}
.tl-name{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-stop.s-passed .tl-name{color:var(--ink-faint);}
.tl-stop.s-current .tl-name{font-weight:700;}
.tl-time{font-size:11px;color:var(--ink-faint);white-space:nowrap;flex-shrink:0;}
.tl-stop.s-current .tl-time{font-weight:700;}
.tl-now{font-size:9px;font-weight:700;background:var(--green-deep);color:#fff;border-radius:999px;padding:1px 6px;flex-shrink:0;}

@media(max-width:640px){
  .bus-panel{top:auto;right:0;left:0;bottom:0;width:auto;max-height:80vh;border-left:none;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(44,42,38,.12);transform:translateY(100%);}
  .bus-panel.open{transform:translateY(0);}
}

/* ━━ BOTTOM PANEL ━━ */
.bottom-panel{display:none;position:absolute;bottom:0;left:0;right:0;z-index:300;background:var(--bg);border-top:1px solid var(--line);border-radius:20px 20px 0 0;transition:height .3s cubic-bezier(.25,1,.5,1);flex-direction:column;overflow:hidden;height:230px;}
.bottom-panel.expanded{height:68vh;}
.panel-handle-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px;cursor:pointer;flex-shrink:0;gap:4px;}
.panel-handle{width:36px;height:4px;background:var(--line);border-radius:2px;}
.panel-handle-hint{font-size:9px;color:var(--ink-faint);letter-spacing:.04em;}
.panel-tabs{display:flex;padding:8px 16px 0;flex-shrink:0;}
.panel-tab{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink-faint);padding:8px 0;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;cursor:pointer;font-family:inherit;transition:color .15s;}
.panel-tab.active{color:var(--green-deep);border-bottom-color:var(--green-deep);}
.panel-content{overflow-y:auto;flex:1;padding:12px 16px 20px;}
.panel-content::-webkit-scrollbar{width:3px;}
@media(max-width:640px){
  .sidebar{display:none;}
  .locate-fab{display:flex;}
  .bottom-panel{display:flex;}
  .map-hint{display:block;}
}
/* ── What's New Banner ──────────────────────────── */
.wn-overlay{position:fixed;inset:0;z-index:900;background:rgba(44,42,38,.45);display:flex;align-items:flex-end;justify-content:center;padding-bottom:0;}
.wn-overlay.wn-hidden{display:none;}
.wn-sheet{background:#FAF8F4;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:28px 28px 36px;box-shadow:0 -8px 40px rgba(44,42,38,.18);animation:wnSlide .4s cubic-bezier(.25,1,.5,1);}
@keyframes wnSlide{from{transform:translateY(100%);}to{transform:translateY(0);}}
.wn-tag{display:inline-flex;align-items:center;gap:6px;background:#5B7F61;color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:20px;margin-bottom:14px;}
.wn-hero{display:flex;align-items:center;gap:16px;margin-bottom:18px;}
.wn-char{flex-shrink:0;}
.wn-title{font-size:20px;font-weight:800;color:#2C2A26;line-height:1.2;}
.wn-sub{font-size:13px;color:#6E6A62;margin-top:4px;}
.wn-items{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.wn-item{display:flex;align-items:flex-start;gap:10px;background:#F0EDE6;border-radius:12px;padding:10px 14px;}
.wn-item-icon{font-size:20px;line-height:1;flex-shrink:0;margin-top:1px;}
.wn-item-body{flex:1;}
.wn-item-title{font-size:13px;font-weight:700;color:#2C2A26;}
.wn-item-desc{font-size:11px;color:#6E6A62;margin-top:2px;}
.wn-close{width:100%;padding:13px;background:#5B7F61;color:#fff;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.wn-close:hover{background:#4A6B50;}
.wn-note{font-size:10px;color:#A8A39A;text-align:center;margin-top:10px;}
</style>
</head>
<body>

<!-- ── What's New Banner ──────────────────────── -->
<div class="wn-overlay" id="wnOverlay">
  <div class="wn-sheet">
    <div class="wn-tag">✨ NEW</div>
    <div class="wn-hero">
      <div class="wn-char">
        <svg viewBox="0 0 48 38" width="72" height="58" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="6" width="44" height="22" rx="6" fill="#5B7F61"/>
          <rect x="3" y="6" width="38" height="6" rx="4" fill="#7A9B7E"/>
          <rect x="5" y="4" width="14" height="4" rx="1.5" fill="#2C2A26" opacity="0.4"/>
          <rect x="3" y="9" width="18" height="14" rx="3" fill="white" opacity="0.96"/>
          <circle cx="8.5" cy="15" r="2.8" fill="#2C2A26"/>
          <circle cx="9.6" cy="13.8" r="1" fill="white"/>
          <circle cx="16" cy="15" r="2.8" fill="#2C2A26"/>
          <circle cx="17.1" cy="13.8" r="1" fill="white"/>
          <ellipse cx="5.5" cy="19" rx="2.2" ry="1.4" fill="#E8836A" opacity="0.38"/>
          <ellipse cx="19" cy="19" rx="2.2" ry="1.4" fill="#E8836A" opacity="0.38"/>
          <path d="M7.5 19.5 Q12.5 22.5 17 19.5" stroke="#5B7F61" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          <rect x="24" y="10" width="9" height="8" rx="2" fill="white" opacity="0.85"/>
          <rect x="35" y="10" width="8" height="8" rx="2" fill="white" opacity="0.85"/>
          <rect x="1" y="25" width="44" height="3" rx="2" fill="#4A6B50"/>
          <circle cx="12" cy="33" r="5" fill="#2C2A26"/>

// Color overrides for original 5 routes only
const COLOR_OVERRIDE={'7':'#5B7F61','8':'#5B7899','1':'#B67A5A','2':'#A58F3A','3':'#7C9BAA'};
const OPERATOR_OVERRIDE={'7':'くるっとバス','8':'くるっとバス','1':'長浜市おでかけワゴン','2':'長浜市おでかけワゴン','3':'長浜市おでかけワゴン'};

const ROUTES=GTFS_RAW.routes.map(r=>({
  ...r,
  color: COLOR_OVERRIDE[r.route_id]||r.color,
  operator: OPERATOR_OVERRIDE[r.route_id]||r.operator||r.name,
  lls: r.shape&&r.shape.length?r.shape:r.stops.map(s=>[s.lat,s.lng]),
}));

const stopIndex={};
ROUTES.forEach(r=>r.stops.forEach(s=>{
  if(!stopIndex[s.id])stopIndex[s.id]={...s,routes:[]};
  if(!stopIndex[s.id].routes.find(x=>x.route_id===r.route_id))stopIndex[s.id].routes.push(r);
}));
const ALL_STOPS=Object.values(stopIndex);

// ━━ TIMETABLE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function timeToSec(t){const[h,m,s]=t.split(':').map(Number);return h*3600+m*60+(s||0);}
function secToHM(s){return`${String(Math.floor(s/3600)%24).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}`;}
function nowSec(){const d=new Date();return d.getHours()*3600+d.getMinutes()*60+d.getSeconds();}
function getNextDeps(route,stopId,n=3){
  const now=nowSec();
  const secs=route.timetable.map(t=>t.times[stopId]).filter(Boolean).map(timeToSec).sort((a,b)=>a-b);
  if(!secs.length)return[];
  const up=secs.filter(s=>s>=now),past=secs.filter(s=>s<now);
  return[...up,...past].slice(0,n).map((s,i)=>({time:secToHM(s),min:Math.floor((i<up.length?s-now:s+86400-now)/60)}));
}
function fmtMin(m){if(m<1)return'まもなく';if(m<60)return`あと${m}分`;return`${Math.floor(m/60)}時間${m%60?m%60+'分':''}後`;}

// ━━ DISTANCE ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function dist(la1,ln1,la2,ln2){const R=6371000,dy=(la2-la1)*Math.PI/180*R,dx=(ln2-ln1)*Math.PI/180*R*Math.cos(la1*Math.PI/180);return Math.sqrt(dx*dx+dy*dy);}
function fmtDist(m){
  if(m<80)  return'すぐそこ';
  if(m<500) return`徒歩約${Math.ceil(m/80)}分（${Math.round(m)}m）`;
  if(m<1000)return`徒歩約${Math.ceil(m/80)}分（${Math.round(m/100)*100}m）`;
  return`${(m/1000).toFixed(1)}km先`;
}
function findNear(lat,lng,n=4){return ALL_STOPS.map(s=>({...s,d:dist(lat,lng,s.lat,s.lng)})).sort((a,b)=>a.d-b.d).slice(0,n);}

// ━━ MAP INIT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const map=L.map('map',{center:[35.1,136.0],zoom:9,zoomControl:false,preferCanvas:true,tap:false});
L.control.zoom({position:'topright'}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19,updateWhenIdle:true,updateWhenZooming:false,keepBuffer:2}).addTo(map);

// ━━ ROUTE RENDERING ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const routeLayers={},stopMarkers={},busMarkers={};
let activeRoute=null;

ROUTES.forEach(r=>{
  if(!r.osm_source){
    L.polyline(r.lls,{color:r.color,weight:8,opacity:.1}).addTo(map);
    const line=L.polyline(r.lls,{color:r.color,weight:3,opacity:.8,lineCap:'round',lineJoin:'round'}).addTo(map);
    routeLayers[r.route_id]=line;
  }

  r.stops.forEach((s,i)=>{
    if(stopMarkers[s.id])return;
    const isT=i===0||i===r.stops.length-1;
    const mk=L.circleMarker([s.lat,s.lng],{radius:isT?7:4,color:'#fff',weight:isT?2:1.5,fillColor:r.color,fillOpacity:isT?0.95:0.75}).addTo(map);
    mk.on('click',()=>openStopPopup(s.id,s.name,[s.lat,s.lng]));
    stopMarkers[s.id]=mk;
  });

  if(!r.osm_source){
    const el=document.createElement('div');
    el.className='bus-mk';el.style.background=r.color+'dd';el.textContent='🚌';
    const busM=L.marker(r.lls[0],{icon:L.divIcon({html:el.outerHTML,className:'',iconSize:[32,32],iconAnchor:[16,16]}),zIndexOffset:500}).addTo(map);
    busM.on('click',()=>openBusPanel(r.route_id));
    busMarkers[r.route_id]={marker:busM,lls:r.lls};
  }
});

// ━━ BUS ANIMATION ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
const busPhase={};
ROUTES.forEach((r,i)=>{busPhase[r.route_id]=i*0.07;});
function interp(lls,t){
  const n=lls.length-1,pos=((t%1+1)%1)*n,i=Math.floor(pos),f=pos-i;
  const a=lls[Math.min(i,n)],b=lls[Math.min(i+1,n)];
  return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];
}
let _lastBusAnim=0;
function _animBuses(ts){
  requestAnimationFrame(_animBuses);
  if(ts-_lastBusAnim<120)return;
  _lastBusAnim=ts;
  const now=Date.now()/1000;
  ROUTES.forEach(r=>{
    const bm=busMarkers[r.route_id];if(!bm)return;
    const t=(now*0.012+busPhase[r.route_id])%2,tt=t<=1?t:2-t;
    bm.marker.setLatLng(interp(bm.lls,tt));
  });
}
requestAnimationFrame(_animBuses);

// ━━ STOP POPUP ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function openStopPopup(stopId,name,latlng){
  const routes=stopIndex[stopId]?.routes||[];
  const tags=routes.map(r=>`<span class="pop-tag" style="background:${r.color}">${r.name.length>8?r.name.slice(0,8)+'…':r.name}</span>`).join('');
  const deps=routes.map(r=>{
    const d=getNextDeps(r,stopId,3);if(!d.length)return'';
    return`<div class="pop-dep-row">
      <div class="pop-dep-dot" style="background:${r.color}"></div>
      <div><div class="pop-dep-label">${r.name.length>10?r.name.slice(0,10)+'…':r.name} · <b style="color:var(--peach-deep)">${fmtMin(d[0].min)}</b></div>
      <div class="pop-dep-times">${d.map((x,i)=>`<span class="pop-time${i===0?' next':''}">${x.time}</span>`).join('')}</div></div>
    </div>`;
  }).filter(Boolean).join('');
  L.popup({maxWidth:230}).setLatLng(latlng)
    .setContent(`<div class="pop-name">${name}</div><div class="pop-tags">${tags}</div><div class="pop-deps">${deps||'<span style="font-size:11px;color:var(--ink-faint)">時刻データなし</span>'}</div>`)
    .openOn(map);
}

// ━━ BUS INFO PANEL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let bpRoute=null,bpTripIdx=0,bpTimer=null;
function openBusPanel(routeId){
  bpRoute=ROUTES.find(r=>r.route_id===routeId);if(!bpRoute)return;
  bpTripIdx=getBestTripIdx(bpRoute);
  document.getElementById('busPanel').classList.add('open');
  if(window.innerWidth<=640)document.getElementById('bottomPanel').style.display='none';
  renderBusPanel();
  if(bpTimer)clearInterval(bpTimer);
  bpTimer=setInterval(renderBusPanel,15000);
}
function closeBusPanel(){
  document.getElementById('busPanel').classList.remove('open');
  if(bpTimer){clearInterval(bpTimer);bpTimer=null;}
  bpRoute=null;
  Object.values(busMarkers).forEach(bm=>{const el=bm.marker.getElement();if(el){const inner=el.querySelector('.bus-mk');if(inner)inner.classList.remove('bp-active');}});
  if(window.innerWidth<=640)document.getElementById('bottomPanel').style.display='';
}
function getBestTripIdx(route){
  const now=nowSec(),ids=route.timetable_stop_ids;
  let best=0,minD=Infinity;
  route.timetable.forEach((t,i)=>{
    const ft=t.times[ids[0]];if(!ft)return;
    const d=Math.abs(timeToSec(ft)-now);
    if(d<minD){minD=d;best=i;}
  });
  return best;
}
function getCurrentStopIdx(route,trip){
  const now=nowSec(),ids=route.timetable_stop_ids;
  let idx=0;
  for(let i=0;i<ids.length;i++){
    const t=trip.times[ids[i]];
    if(t&&timeToSec(t)<=now)idx=i;else break;
  }
  return idx;
}
function renderBusPanel(){
  const r=bpRoute;if(!r)return;
  document.getElementById('bpStripe').style.background=r.color;
  document.getElementById('bpName').textContent=r.name;
  document.getElementById('bpOp').textContent=r.operator+(r.osm_source?' 📡':'');
  // OSM-only route (no timetable)
  if(!r.timetable||r.timetable.length===0){
    document.getElementById('bpNext').innerHTML=`<span style="color:var(--ink-faint);font-size:12px">📡 OpenStreetMapの参考データです。時刻表・リアルタイム情報はありません</span>`;
    document.getElementById('bpTripSel').innerHTML='';
    const strip=document.getElementById('bpRouteStrip');
    if(strip){strip.innerHTML=`<div class="rt-strip">${r.stops.map((s,i)=>{const isT=i===0||i===r.stops.length-1;const connector=i>0?`<div class="rt-connector" style="background:${r.color}55"></div>`:'';return`<div class="rt-stop">${connector}<div class="${isT?'rt-dot rt-terminal':'rt-dot'}" style="background:${r.color}88;"></div><div class="rt-label">${s.name}</div></div>`}).join('')}</div>`;}
    document.querySelector('.trip-label').style.display='none';
    document.getElementById('bpTimeline').innerHTML=r.stops.map(s=>`<div class="tl-stop"><div class="tl-dot"></div><div class="tl-body"><span class="tl-name">${s.name}</span><span class="tl-time" style="color:var(--ink-faint)">参考</span></div></div>`).join('');
    Object.entries(busMarkers).forEach(([rid,bm])=>{const el=bm.marker.getElement();if(el){const inner=el.querySelector('.bus-mk');if(inner)inner.classList.toggle('bp-active',rid===r.route_id);}});
    return;
  }
  document.querySelector('.trip-label').style.display='';
  const trip=r.timetable[bpTripIdx],ids=r.timetable_stop_ids,now=nowSec();
  const curIdx=getCurrentStopIdx(r,trip);
  const nextIdx=Math.min(curIdx+1,ids.length-1);
  const nextStop=r.stops.find(s=>s.id===ids[nextIdx]);
  const nextTime=trip.times[ids[nextIdx]];
  const minsNext=nextTime?Math.max(0,Math.floor((timeToSec(nextTime)-now)/60)):null;
  document.getElementById('bpNext').innerHTML=nextStop&&minsNext!==null
    ?`次の停留所 → <span class="bp-next-stop">${nextStop.name}</span><br><span class="bp-next-min">${minsNext<1?'まもなく':'あと'+minsNext+'分'}</span>`
    :`<span style="color:var(--ink-faint)">終点に到着済み</span>`;
  document.getElementById('bpTripSel').innerHTML=r.timetable.map((t,i)=>{
    const ft=t.times[ids[0]];const lbl=ft?secToHM(timeToSec(ft))+'発':`便${i+1}`;
    return`<button class="trip-pill${i===bpTripIdx?' active':''}" onclick="selectBusPanelTrip(${i})">${lbl}</button>`;
  }).join('');
  document.getElementById('bpTimeline').innerHTML=ids.map((sid,i)=>{
    const stop=r.stops.find(s=>s.id===sid);if(!stop)return'';
    const t=trip.times[sid],sec=t?timeToSec(t):null;
    const isPassed=i<curIdx,isCurrent=i===curIdx,isTerminal=i===0||i===ids.length-1;
    const dotStyle=isCurrent?`background:${r.color};border-color:${r.color};`:isTerminal&&!isPassed?`border-color:${r.color};`:'';
    const cls=`tl-stop${isPassed?' s-passed':isCurrent?' s-current':''}`;
    const dotCls=`tl-dot${isPassed?' passed':isCurrent?' current':''}`;
    const minsAway=sec!=null?Math.floor((sec-now)/60):null;
    const timeStyle=isCurrent?`color:${r.color};font-weight:700;`:(!isPassed&&minsAway!=null&&minsAway>=0&&minsAway<=10)?'color:var(--peach-deep);font-weight:600;':'';
    return`<div class="${cls}"><div class="${dotCls}" style="${dotStyle}"></div>
      <div class="tl-body">
        <span class="tl-name">${stop.name}</span>
        ${isCurrent?`<span class="tl-now">今ここ</span>`:''}
        <span class="tl-time" style="${timeStyle}">${t?secToHM(timeToSec(t)):'—'}</span>
      </div></div>`;
  }).join('');
  // ── Route strip ─────────────────────────────────────
  const strip=document.getElementById('bpRouteStrip');
  if(strip){
    const stripHtml=ids.map((sid,i)=>{
      const stop=r.stops.find(s=>s.id===sid);if(!stop)return'';
      const t=trip.times[sid];
      const isPassed=i<curIdx,isCurrent=i===curIdx,isTerminal=i===0||i===ids.length-1;
      const opacity=isPassed?'55':'';
      const dotSz=isTerminal?'rt-dot rt-terminal':isCurrent?'rt-dot rt-current':'rt-dot';
      const lblCls='rt-label'+(isCurrent?' rt-lbl-current':isPassed?' rt-lbl-passed':'');
      const busEl=isCurrent?`<div class="rt-bus-icon">🚌</div>`:'';
      const minsA=t&&!isPassed?Math.floor((timeToSec(t)-now)/60):null;
      const timeTxt=t?(minsA!=null&&minsA>=0&&minsA<60?`あと${minsA}分`:secToHM(timeToSec(t))):'';
      const timeCls=minsA!=null&&minsA>=0&&minsA<10?'rt-time-lbl rt-soon':'rt-time-lbl';
      const connector=i>0?`<div class="rt-connector" style="background:${r.color+opacity}"></div>`:'';
      return`<div class="rt-stop">${busEl}<div class="rt-dot-wrap">${connector}<div class="${dotSz}" style="background:${r.color+opacity};"></div></div><div class="${lblCls}">${stop.name}</div><div class="${timeCls}">${timeTxt}</div></div>`;
    }).join('');
    strip.innerHTML=`<div class="rt-strip">${stripHtml}</div>`;
    const cur=strip.querySelector('.rt-current');
    if(cur)setTimeout(()=>cur.closest('.rt-stop').scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}),120);
  }
  // ── Active bus marker highlight ──────────────────────
  Object.entries(busMarkers).forEach(([rid,bm])=>{
    const el=bm.marker.getElement();
    if(el){const inner=el.querySelector('.bus-mk');if(inner)inner.classList.toggle('bp-active',rid===r.route_id);}
  });
    setTimeout(()=>{const el=document.querySelector('#bpTimeline .s-current');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},150);
}
function selectBusPanelTrip(idx){bpTripIdx=idx;renderBusPanel();}

// ━━ NEAR STOPS ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function nearCardHTML(s){
  const rows=s.routes.map(r=>{
    const d=getNextDeps(r,s.id,3);if(!d.length)return'';
    return`<div class="near-route-row"><div class="near-route-dot" style="background:${r.color}"></div><span class="near-route-name">${r.name}</span></div>
    <div class="near-times">${d.map((x,i)=>`<span class="near-time${i===0?' next':''}">${x.time}</span>`).join('')}</div>`;
  }).filter(Boolean).join('');
  return`<div class="near-card" onclick="goToStop('${s.id}','${s.name}',${s.lat},${s.lng})">
    <div class="near-card-head"><span class="near-stop-name">${s.name}</span><span class="near-dist">${fmtDist(s.d)}</span></div>
    ${rows||'<span style="font-size:10px;color:var(--ink-faint)">時刻データなし</span>'}
  </div>`;
}
let lastNear=[];
function renderNear(near){
  lastNear=near;
  const NO_DATA_KM=2;
  const tooFar=near.length>0&&near[0].d>NO_DATA_KM*1000;
  let html;
  if(tooFar){
    html=`<div class="near-empty" style="text-align:left;padding:12px 0">
      <div style="font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:6px">📡 このエリアはデータなし</div>
      <div style="font-size:11px;line-height:1.7;color:var(--ink-faint)">現在地周辺のバスデータがありません。<br>現在対応エリア：草津市・栗東市・守山市・野洲市・湖南市・甲賀市・高島市・東近江市・近江八幡市・日野町・長浜市（北部）・守山市・東近江市・近江八幡市・日野町・甲賀市・長浜市</div>
      <div style="margin-top:10px;font-size:10px;color:var(--ink-faint)">最寄り（${(near[0].d/1000).toFixed(1)}km先）</div>
    </div>`+near.map(nearCardHTML).join('');
  } else {
    html=near.map(nearCardHTML).join('')||'<div class="near-empty">このエリアのバス停データがありません</div>';
  }
  document.getElementById('nearListD').innerHTML=html;
  if(currentTab==='near')document.getElementById('panelContent').innerHTML=html;
}
function goToStop(id,name,lat,lng){map.setView([lat,lng],16);openStopPopup(id,name,[lat,lng]);}

// ━━ GEOLOCATION ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let userMarker=null;
function locateMe(){
  ['locateBtnD','locateBtnM'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.add('loading');});
  if(!navigator.geolocation){alert('このブラウザは位置情報に対応していません');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    map.setView([lat,lng],14);
    if(userMarker)map.removeLayer(userMarker);
    const ph=`<div class="pulse-wrap"><div class="pulse-ring"></div><div class="pulse-dot"></div></div>`;
    userMarker=L.marker([lat,lng],{icon:L.divIcon({html:ph,className:'',iconSize:[32,32],iconAnchor:[16,16]}),zIndexOffset:1000}).addTo(map);
    renderNear(findNear(lat,lng,4));
    ['locateBtnD','locateBtnM'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('loading');});
    const hint=document.getElementById('mapHint');if(hint)hint.style.display='none';
    if(window.innerWidth<=640){document.getElementById('bottomPanel').classList.add('expanded');switchTab('near');}
  },()=>{
    ['locateBtnD','locateBtnM'].forEach(id=>{const el=document.getElementById(id);if(el)el.classList.remove('loading');});
    alert('位置情報を取得できませんでした。\nブラウザの設定をご確認ください。');
  },{enableHighAccuracy:true,timeout:8000});
}

// ━━ SIDEBAR ROUTES ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
function makeStopItems(route,lim){
  const stops=lim?route.stops.slice(0,lim):route.stops;
  return stops.map((s,i)=>{
    const deps=getNextDeps(route,s.id,1);
    const lbl=deps.length?(deps[0].min<60?fmtMin(deps[0].min):deps[0].time):'—';
    const soon=deps.length&&deps[0].min<=5;
    const isF=i===0,isL=i===stops.length-1;
    return`<div class="stop-item"><div class="stop-dot" style="color:${route.color};${isF||isL?`background:${route.color};`:''}"></div><span class="stop-nm">${s.name}</span><span class="stop-next${soon?' soon':''}">${lbl}</span></div>`;
  }).join('');
}
function routeCardHTML(r){
  return`<div class="route-card" id="rc-${r.route_id}" onclick="selectRoute('${r.route_id}')">
    <div class="route-card-head">
      <div class="route-stripe" style="background:${r.color}"></div>
      <div class="route-info"><div class="route-name">${r.name}</div><div class="route-op">${r.operator}</div></div>
      <div class="route-badge">運行中</div>
    </div>
    <div class="route-detail">
      <div class="detail-meta">
        <div class="dmeta"><div class="dmeta-label">停留所</div><div class="dmeta-val">${r.stops.length}箇所</div></div>
        <div class="dmeta"><div class="dmeta-label">便数/日</div><div class="dmeta-val">${r.timetable.length}便</div></div>
      </div>
      <div class="stop-list" id="sl-${r.route_id}">${makeStopItems(r,6)}</div>
      ${r.stops.length>6?`<div class="stops-more" onclick="toggleStops(event,'${r.route_id}')">▸ 全${r.stops.length}停留所</div>`:''}
    </div>
  </div>`;
}
function renderRoutes(){document.getElementById('routeListD').innerHTML=ROUTES.map(routeCardHTML).join('');}
function toggleStops(e,id){
  e.stopPropagation();
  const r=ROUTES.find(x=>x.route_id===id),sl=document.getElementById('sl-'+id);
  if(e.target.dataset.exp){sl.innerHTML=makeStopItems(r,6);e.target.textContent=`▸ 全${r.stops.length}停留所`;delete e.target.dataset.exp;}
  else{sl.innerHTML=makeStopItems(r,0);e.target.textContent='▴ 閉じる';e.target.dataset.exp='1';}
}
function selectRoute(id){
  if(activeRoute===id){activeRoute=null;document.querySelectorAll('.route-card').forEach(el=>el.classList.remove('active'));ROUTES.forEach(r=>{if(routeLayers[r.route_id])routeLayers[r.route_id].setStyle({opacity:.8,weight:3});});return;}
  activeRoute=id;
  document.querySelectorAll('.route-card').forEach(el=>el.classList.toggle('active',el.id==='rc-'+id));
  ROUTES.forEach(r=>{if(routeLayers[r.route_id]){const dim=r.route_id!==id;routeLayers[r.route_id].setStyle({opacity:dim?.12:1,weight:dim?2:5});}});
  const r=ROUTES.find(x=>x.route_id===id);
  if(r&&r.stops.length){const pts=r.stops.map(s=>[s.lat,s.lng]);map.fitBounds(L.polyline(pts).getBounds(),{padding:[60,60]});}
}

// ━━ MOBILE PANEL ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let currentTab='near';
function togglePanel(){document.getElementById('bottomPanel').classList.toggle('expanded');}
function switchTab(tab){
  currentTab=tab;
  document.getElementById('tabNear').classList.toggle('active',tab==='near');
  document.getElementById('tabRoutes').classList.toggle('active',tab==='routes');
  const pc=document.getElementById('panelContent');
  if(tab==='routes'){pc.innerHTML=`<div class="sec-label" style="margin-bottom:8px">路線一覧</div>`+ROUTES.map(routeCardHTML).join('');}
  else{const nd=document.getElementById('nearListD').innerHTML;pc.innerHTML=nd||`<div style="display:flex;flex-direction:column;align-items:center;padding:20px 0 8px;gap:10px"><div style="font-size:32px">🚌</div><div style="font-size:13px;font-weight:700;color:var(--ink)">近くのバス停を探す</div><div style="font-size:11px;color:var(--ink-faint);text-align:center;line-height:1.6">現在地を使ってバス停と<br>次の発車時刻を確認できます</div><button onclick="locateMe()" style="margin-top:4px;background:var(--green);color:#fff;border:none;border-radius:22px;padding:11px 24px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit">📍 現在地を取得</button></div>`;}
}

// ━━ SEARCH ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.trim();if(!q)return;
  for(const r of ROUTES){
    for(const s of r.stops){if(s.name.includes(q)){map.setView([s.lat,s.lng],16);openStopPopup(s.id,s.name,[s.lat,s.lng]);this.blur();return;}}
    if(r.name.includes(q)){selectRoute(r.route_id);this.blur();return;}
  }
});

// ━━ INIT ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
renderRoutes();switchTab('near');
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(pos=>{
    const{latitude:lat,longitude:lng}=pos.coords;
    if(userMarker)map.removeLayer(userMarker);
    const ph=`<div class="pulse-wrap"><div class="pulse-ring"></div><div class="pulse-dot"></div></div>`;
    userMarker=L.marker([lat,lng],{icon:L.divIcon({html:ph,className:'',iconSize:[32,32],iconAnchor:[16,16]}),zIndexOffset:1000}).addTo(map);
    map.setView([lat,lng],14);
    renderNear(findNear(lat,lng,4));
  },()=>{},{enableHighAccuracy:true,timeout:5000});
}
</script>
</body>
