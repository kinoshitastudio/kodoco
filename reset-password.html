<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>パスワードを再設定 — KODOCO</title>
<meta name="description" content="KODOCO パスワードの再設定ページ">
<meta name="robots" content="noindex">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.svg">
<link rel="manifest" href="manifest.webmanifest">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper:    #FAFAF7;
    --ink:      #1F1F1F;
    --green:    #5C8A5A;
    --green-soft: #E5EFE2;
    --green-deep: #2F5A2D;
    --line:     rgba(31,31,31,0.16);
    --error:    #C0392B;
  }
  html, body {
    background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px 20px;
  }
  .shell {
    width: 100%; max-width: 420px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }
  h1 {
    font-size: 18px; font-weight: 800; margin-bottom: 8px;
  }
  p.lede {
    font-size: 13px; color: rgba(31,31,31,0.62); line-height: 1.6; margin-bottom: 20px;
  }
  .field { margin-bottom: 14px; }
  .field-lbl {
    font-size: 12px; font-weight: 700; color: rgba(31,31,31,0.7); margin-bottom: 6px;
  }
  input[type="password"] {
    width: 100%; padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--line); font-size: 15px;
    background: var(--paper); color: var(--ink);
  }
  input[type="password"]:focus {
    outline: none; border-color: var(--green); background: #fff;
  }
  .submit {
    width: 100%; padding: 13px; border: 0; border-radius: 10px;
    background: var(--green); color: #fff; font-weight: 800; font-size: 15px;
    cursor: pointer; margin-top: 6px;
    transition: background 0.15s, opacity 0.15s;
  }
  .submit:hover { background: var(--green-deep); }
  .submit:disabled { opacity: 0.5; cursor: default; }
  .err {
    color: var(--error); font-size: 13px; margin-top: 10px; min-height: 1em;
  }
  .ok {
    color: var(--green-deep); font-size: 13px; margin-top: 10px; min-height: 1em;
  }
  .footer {
    text-align: center; margin-top: 22px; font-size: 12px; color: rgba(31,31,31,0.5);
  }
  .footer a { color: var(--green-deep); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="shell">
  <h1>パスワードを再設定</h1>
  <p class="lede">新しいパスワードを設定してください。<br>6 文字以上を推奨します。</p>

  <form id="resetForm" onsubmit="return false;">
    <div class="field">
      <div class="field-lbl">新しいパスワード</div>
      <input type="password" id="newPw" autocomplete="new-password" placeholder="6 文字以上" minlength="6" required>
    </div>
    <div class="field">
      <div class="field-lbl">確認のためもう一度</div>
      <input type="password" id="newPw2" autocomplete="new-password" placeholder="同じパスワード" minlength="6" required>
    </div>
    <button type="submit" class="submit" id="submitBtn">パスワードを更新</button>
    <div class="err" id="err"></div>
    <div class="ok"  id="ok"></div>
  </form>

  <div class="footer">
    <a href="app.html">← KODOCO に戻る</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(function () {
  const form = document.getElementById('resetForm');
  const errEl = document.getElementById('err');
  const okEl  = document.getElementById('ok');
  const btn   = document.getElementById('submitBtn');

  // Supabase の reset リンクは URL hash に access_token を含めて飛んでくる。
  // detectSessionInUrl: true で自動取り込み済み。auth-ready を待つ。
  function showErr(msg) { errEl.textContent = msg; okEl.textContent = ''; }
  function showOk(msg)  { okEl.textContent  = msg; errEl.textContent = ''; }

  form.addEventListener('submit', async () => {
    const sb = window.kodocoSupabase;
    if (!sb) { showErr('接続準備中… 数秒待ってから再試行'); return; }
    const pw  = document.getElementById('newPw').value;
    const pw2 = document.getElementById('newPw2').value;
    if (pw.length < 6)   { showErr('6 文字以上を入力してください'); return; }
    if (pw !== pw2)      { showErr('パスワードが一致しません'); return; }

    btn.disabled = true;
    try {
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) { showErr(error.message); return; }
      showOk('パスワードを更新しました ✨ 3 秒後に KODOCO に戻ります...');
      setTimeout(() => { location.href = 'app.html'; }, 3000);
    } catch (e) {
      showErr(String(e && e.message || e));
    } finally {
      btn.disabled = false;
    }
  });

  // セッションが無い (リンク無効 / 期限切れ) 場合のガード
  document.addEventListener('kodoco:auth-ready', () => {
    if (!window.kodocoUser) {
      showErr('リセットリンクが無効か期限切れです。もう一度メール送信からやり直してください。');
      btn.disabled = true;
    }
  });
})();
</script>
</body>
</html>
